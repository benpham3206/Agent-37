[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent37"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "onnx>=1.15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*"]

[project.scripts]
agent37 = "harness.combat.cli:main"
